<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HK 通关游戏 · hktggame</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #06080f;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #e8eefc;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  #wrap { position: relative; width: min(100vw, 960px); }
  canvas {
    display: block; width: 100%; height: auto;
    border-radius: 14px;
    box-shadow: 0 24px 70px rgba(0,0,0,.7), 0 0 0 1px rgba(120,170,255,.14);
    background: #0b1020;
    touch-action: none;
    cursor: pointer;
  }
  #pad {
    position: absolute; inset: auto 0 -4px 0;
    display: none;
    justify-content: space-between;
    padding: 0 10px;
    pointer-events: none;
  }
  #pad .side { display: flex; gap: 12px; pointer-events: auto; }
  .btn {
    width: 66px; height: 66px; border-radius: 50%;
    background: rgba(120,170,255,.14);
    border: 1px solid rgba(120,170,255,.35);
    color: #cfe0ff; font-size: 22px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
    backdrop-filter: blur(4px);
  }
  .btn:active, .btn.on { background: rgba(120,170,255,.42); transform: scale(.95); }
  @media (pointer: coarse) { #pad { display: flex; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="pad">
    <div class="side">
      <div class="btn" id="bl">◀</div>
      <div class="btn" id="br">▶</div>
    </div>
    <div class="side">
      <div class="btn" id="bj">⤒</div>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 960, H = 540;

  /* ---------------- 物理参数 ---------------- */
  var GRAV = 2200, MOVE = 340, ACC = 2800, FRIC = 2600;
  var JUMP = 760, MAXFALL = 1150, COYOTE = 0.09, BUFFER = 0.12;

  /* ---------------- 关卡 ---------------- */
  var LEVELS = [
    {
      name: '第一关 · 起步',
      accent: '#4cc9f0',
      spawn: [60, 420],
      solids: [[0,500,960,40],[200,400,180,20],[460,330,170,20],[700,420,170,20],[80,300,120,18]],
      spikes: [],
      keys: [[270,360],[520,290],[780,380]],
      goal: [896, 440]
    },
    {
      name: '第二关 · 断桥',
      accent: '#f9c74f',
      spawn: [50, 420],
      solids: [[0,500,280,40],[360,500,220,40],[660,500,300,40],[300,410,120,18],[560,390,120,18],[120,330,140,18],[820,340,120,18]],
      spikes: [[700,470],[790,470]],
      keys: [[180,460],[330,370],[600,350],[870,300]],
      goal: [896, 440]
    },
    {
      name: '第三关 · 尖刺',
      accent: '#f72585',
      spawn: [40, 420],
      solids: [[0,500,200,40],[260,500,140,40],[460,500,120,40],[640,500,120,40],[820,500,140,40],[180,400,120,18],[380,330,120,18],[580,270,120,18],[760,380,120,18],[300,240,100,18]],
      spikes: [[300,470],[500,470],[660,470]],
      keys: [[230,360],[430,290],[630,230],[810,345],[340,200]],
      goal: [896, 440]
    }
  ];

  /* ---------------- 状态 ---------------- */
  var state = 'title';
  var levelIndex = 0;
  var level = null;
  var player = null;
  var keysGot = [];
  var totalKeys = 0;
  var levelTime = 0, totalTime = 0;
  var deaths = 0;
  var clearTimer = 0;
  var deathTimer = 0;
  var particles = [];
  var shake = 0;
  var best = 0;
  var muted = false;
  var t = 0;

  try { best = parseFloat(localStorage.getItem('hktggame.best') || '0') || 0; } catch (e) { best = 0; }

  /* ---------------- 音频 ---------------- */
  var actx = null;
  function beep(freq, dur, type, vol) {
    if (muted) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.value = vol || 0.05;
      o.connect(g); g.connect(actx.destination);
      var now = actx.currentTime;
      g.gain.setValueAtTime(g.gain.value, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      o.start(now); o.stop(now + dur + 0.02);
    } catch (e) {}
  }

  /* ---------------- 输入 ---------------- */
  var input = { left: false, right: false, jump: false };
  var jumpBuffer = 0;

  var KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'jump', KeyW: 'jump', Space: 'jump'
  };

  window.addEventListener('keydown', function (e) {
    var k = KEYMAP[e.code];
    if (k) {
      e.preventDefault();
      if (k === 'jump' && !input.jump) jumpBuffer = BUFFER;
      input[k] = true;
    }
    if (e.code === 'KeyR') { e.preventDefault(); restartLevel(); }
    if (e.code === 'KeyM') { muted = !muted; }
    if (e.code === 'Space' || e.code === 'Enter') {
      if (state === 'title') { startGame(); }
      else if (state === 'win') { startGame(); }
    }
  }, { passive: false });

  window.addEventListener('keyup', function (e) {
    var k = KEYMAP[e.code];
    if (k) { e.preventDefault(); input[k] = false; }
  }, { passive: false });

  function bindHold(el, key) {
    function down(ev) { ev.preventDefault(); if (key === 'jump' && !input.jump) jumpBuffer = BUFFER; input[key] = true; el.classList.add('on'); }
    function up(ev) { ev.preventDefault(); input[key] = false; el.classList.remove('on'); }
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', up);
  }
  bindHold(document.getElementById('bl'), 'left');
  bindHold(document.getElementById('br'), 'right');
  bindHold(document.getElementById('bj'), 'jump');

  canvas.addEventListener('pointerdown', function () {
    if (state === 'title' || state === 'win') startGame();
  });

  /* ---------------- 关卡装载 ---------------- */
  function loadLevel(i) {
    levelIndex = i;
    var L = LEVELS[i];
    level = L;
    totalKeys = L.keys.length;
    keysGot = L.keys.map(function () { return false; });
    player = {
      x: L.spawn[0], y: L.spawn[1], w: 26, h: 34,
      vx: 0, vy: 0, onGround: false, coyote: 0, face: 1, alive: true,
      squash: 0
    };
    levelTime = 0;
    clearTimer = 0;
    deathTimer = 0;
    particles = [];
    input.left = input.right = input.jump = false;
    state = 'play';
  }

  function startGame() {
    totalTime = 0;
    deaths = 0;
    loadLevel(0);
    beep(520, 0.08, 'square', 0.05);
  }

  function restartLevel() {
    if (state === 'play' || state === 'dead') { loadLevel(levelIndex); }
  }

  /* ---------------- 碰撞 ---------------- */
  function overlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function rectOf(arr) { return { x: arr[0], y: arr[1], w: arr[2], h: arr[3] }; }

  /* ---------------- 更新 ---------------- */
  function update(dt) {
    t += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 60);

    for (var p = particles.length - 1; p >= 0; p--) {
      var pa = particles[p];
      pa.x += pa.vx * dt; pa.y += pa.vy * dt;
      pa.vy += 900 * dt; pa.life -= dt;
      if (pa.life <= 0) particles.splice(p, 1);
    }

    if (state === 'clear') {
      clearTimer -= dt;
      if (clearTimer <= 0) {
        if (levelIndex + 1 < LEVELS.length) loadLevel(levelIndex + 1);
        else {
          state = 'win';
          if (best === 0 || totalTime < best) {
            best = totalTime;
            try { localStorage.setItem('hktggame.best', String(best)); } catch (e) {}
          }
          beep(660, .12, 'triangle', .06);
          setTimeout(function () { beep(880, .18, 'triangle', .06); }, 130);
          setTimeout(function () { beep(1180, .28, 'triangle', .06); }, 280);
        }
      }
      return;
    }

    if (state === 'dead') {
      deathTimer -= dt;
      if (deathTimer <= 0) {
        player.x = level.spawn[0]; player.y = level.spawn[1];
        player.vx = player.vy = 0; player.alive = true;
        levelTime = 0;
        input.left = input.right = input.jump = false;
        state = 'play';
      }
      return;
    }

    if (state !== 'play') return;

    levelTime += dt;
    totalTime += dt;
    if (jumpBuffer > 0) jumpBuffer -= dt;

    var P = player;

    /* 水平 */
    var dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    if (dir !== 0) {
      P.vx += dir * ACC * dt;
      P.face = dir;
      if (Math.abs(P.vx) > MOVE) P.vx = MOVE * Math.sign(P.vx);
    } else {
      var f = FRIC * dt;
      if (Math.abs(P.vx) <= f) P.vx = 0; else P.vx -= Math.sign(P.vx) * f;
    }

    /* 跳 */
    P.coyote = P.onGround ? COYOTE : Math.max(0, P.coyote - dt);
    if (jumpBuffer > 0 && P.coyote > 0) {
      P.vy = -JUMP; P.coyote = 0; jumpBuffer = 0; P.onGround = false;
      P.squash = -0.28;
      beep(340, 0.07, 'square', 0.035);
    }
    if (!input.jump && P.vy < -260) P.vy = -260; /* 松手减速，可控跳高 */

    P.vy = Math.min(MAXFALL, P.vy + GRAV * dt);

    var solids = level.solids.map(rectOf);

    /* X 轴 */
    P.x += P.vx * dt;
    for (var i = 0; i < solids.length; i++) {
      var s = solids[i];
      if (overlap(P, s)) {
        if (P.vx > 0) P.x = s.x - P.w;
        else if (P.vx < 0) P.x = s.x + s.w;
        P.vx = 0;
      }
    }
    if (P.x < 0) { P.x = 0; P.vx = 0; }
    if (P.x + P.w > W) { P.x = W - P.w; P.vx = 0; }

    /* Y 轴 */
    var wasAir = !P.onGround;
    P.onGround = false;
    P.y += P.vy * dt;
    for (var j = 0; j < solids.length; j++) {
      var s2 = solids[j];
      if (overlap(P, s2)) {
        if (P.vy > 0) {
          P.y = s2.y - P.h; P.vy = 0; P.onGround = true;
          if (wasAir) { P.squash = 0.3; beep(180, .05, 'sine', .03); }
        } else if (P.vy < 0) {
          P.y = s2.y + s2.h; P.vy = 0;
        }
      }
    }

    P.squash += (0 - P.squash) * Math.min(1, dt * 12);

    /* 掉出屏幕 */
    if (P.y > H + 80) { die(); return; }

    /* 尖刺 */
    for (var k = 0; k < level.spikes.length; k++) {
      var sp = level.spikes[k];
      if (overlap(P, { x: sp[0] + 4, y: sp[1] + 12, w: 32, h: 28 })) { die(); return; }
    }

    /* 收集钥匙 */
    for (var m = 0; m < level.keys.length; m++) {
      if (keysGot[m]) continue;
      var kx = level.keys[m][0], ky = level.keys[m][1];
      var cx = P.x + P.w / 2, cy = P.y + P.h / 2;
      if (Math.hypot(cx - kx, cy - ky) < 30) {
        keysGot[m] = true;
        burst(kx, ky, level.accent, 14);
        beep(760 + m * 90, 0.1, 'sine', 0.05);
      }
    }

    /* 门 */
    var allKeys = keysGot.every(function (v) { return v; });
    var g = level.goal;
    var door = { x: g[0], y: g[1], w: 44, h: 60 };
    if (allKeys && overlap(P, door)) {
      state = 'clear';
      clearTimer = 0.85;
      burst(g[0] + 22, g[1] + 30, '#ffffff', 26);
      beep(620, .1, 'triangle', .06);
      setTimeout(function () { beep(930, .2, 'triangle', .06); }, 110);
    }
  }

  function die() {
    if (state !== 'play') return;
    deaths++;
    state = 'dead';
    deathTimer = 0.55;
    shake = 14;
    burst(player.x + player.w / 2, player.y + player.h / 2, '#f72585', 22);
    beep(120, 0.25, 'sawtooth', 0.05);
  }

  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 260;
      particles.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80,
        life: 0.45 + Math.random() * 0.5, max: 0.95, color: color,
        r: 1.6 + Math.random() * 2.6
      });
    }
  }

  /* ---------------- 绘制 ---------------- */
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBackground() {
    var acc = (level && level.accent) || '#4cc9f0';
    var grd = ctx.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, '#080c18');
    grd.addColorStop(0.55, '#0d1428');
    grd.addColorStop(1, '#121a33');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    /* 光晕 */
    var rg = ctx.createRadialGradient(W * 0.5, H * 0.15, 20, W * 0.5, H * 0.15, 620);
    rg.addColorStop(0, hexA(acc, 0.18));
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);

    /* 网格 */
    ctx.strokeStyle = 'rgba(120,170,255,.055)';
    ctx.lineWidth = 1;
    var off = (t * 12) % 48;
    for (var x = -48 + off; x < W; x += 48) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (var y = 0; y < H; y += 48) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    /* 星点 */
    for (var i = 0; i < 26; i++) {
      var sx = (i * 137.5 + t * 8 * (0.3 + (i % 5) * 0.15)) % W;
      var sy = (i * 61) % (H * 0.75);
      var al = 0.12 + 0.18 * Math.abs(Math.sin(t * 1.4 + i));
      ctx.fillStyle = 'rgba(200,225,255,' + al.toFixed(3) + ')';
      ctx.fillRect(sx, sy, 2, 2);
    }
  }

  function hexA(hex, a) {
    var n = hex.replace('#', '');
    if (n.length === 3) n = n[0] + n[0] + n[1] + n[1] + n[2] + n[2];
    var r = parseInt(n.slice(0, 2), 16), g = parseInt(n.slice(2, 4), 16), b = parseInt(n.slice(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  function drawSolids() {
    for (var i = 0; i < level.solids.length; i++) {
      var s = rectOf(level.solids[i]);
      var g = ctx.createLinearGradient(0, s.y, 0, s.y + s.h);
      g.addColorStop(0, 'rgba(58,80,130,.95)');
      g.addColorStop(1, 'rgba(28,40,70,.95)');
      ctx.fillStyle = g;
      roundRect(s.x, s.y, s.w, s.h, 6);
      ctx.fill();
      ctx.strokeStyle = 'rgba(120,180,255,.35)';
      ctx.lineWidth = 1.5;
      roundRect(s.x + 0.5, s.y + 0.5, s.w - 1, s.h - 1, 6);
      ctx.stroke();
      /* 顶部高光 */
      ctx.fillStyle = hexA(level.accent, 0.55);
      roundRect(s.x + 4, s.y + 2, Math.max(8, s.w - 8), 3, 2);
      ctx.fill();
    }
  }

  function drawSpikes() {
    for (var i = 0; i < level.spikes.length; i++) {
      var sp = level.spikes[i];
      for (var k = 0; k < 4; k++) {
        var x = sp[0] + k * 10;
        ctx.beginPath();
        ctx.moveTo(x, sp[1] + 30);
        ctx.lineTo(x + 5, sp[1] + 10);
        ctx.lineTo(x + 10, sp[1] + 30);
        ctx.closePath();
        ctx.fillStyle = '#ff4d6d';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.5)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }

  function drawKeys() {
    for (var i = 0; i < level.keys.length; i++) {
      if (keysGot[i]) continue;
      var kx = level.keys[i][0], ky = level.keys[i][1];
      var bob = Math.sin(t * 3 + i) * 5;
      var glow = 0.5 + 0.5 * Math.sin(t * 4 + i);
      ctx.save();
      ctx.globalAlpha = 0.35 + glow * 0.4;
      var rg = ctx.createRadialGradient(kx, ky + bob, 2, kx, ky + bob, 26);
      rg.addColorStop(0, 'rgba(255,235,150,.85)');
      rg.addColorStop(1, 'rgba(255,235,150,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(kx, ky + bob, 26, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(kx, ky + bob);
      ctx.rotate(Math.sin(t * 1.6 + i) * 0.25);
      ctx.fillStyle = '#ffd166';
      ctx.strokeStyle = '#8a5a00';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(-4, 0, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#0b1020';
      ctx.beginPath(); ctx.arc(-4, 0, 2.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd166';
      ctx.fillRect(2, -3, 12, 6);
      ctx.strokeRect(2, -3, 12, 6);
      ctx.fillRect(10, 3, 4, 5);
      ctx.restore();
    }
  }

  function drawGoal() {
    var g = level.goal;
    var allKeys = keysGot.length > 0 && keysGot.every(function (v) { return v; });
    var pulse = 0.5 + 0.5 * Math.sin(t * 3);

    ctx.save();
    if (allKeys) {
      var rg = ctx.createRadialGradient(g[0] + 22, g[1] + 30, 4, g[0] + 22, g[1] + 30, 70);
      rg.addColorStop(0, 'rgba(120,255,190,' + (0.35 + pulse * 0.25).toFixed(2) + ')');
      rg.addColorStop(1, 'rgba(120,255,190,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(g[0] + 22, g[1] + 30, 70, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = allKeys ? '#123023' : '#1a2138';
    ctx.strokeStyle = allKeys ? '#5ef0a8' : 'rgba(120,170,255,.45)';
    ctx.lineWidth = 2.5;
    roundRect(g[0], g[1], 44, 60, 8);
    ctx.fill(); ctx.stroke();
    /* 门把手 */
    ctx.fillStyle = allKeys ? '#5ef0a8' : 'rgba(160,190,240,.6)';
    ctx.beginPath(); ctx.arc(g[0] + 33, g[1] + 32, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawPlayer() {
    if (!player) return;
    var P = player;
    var sq = P.squash || 0;
    var w = P.w * (1 + sq * 0.4);
    var h = P.h * (1 - sq * 0.4);
    var x = P.x - (w - P.w) / 2;
    var y = P.y + (P.h - h);

    ctx.save();
    ctx.shadowColor = hexA(level.accent, 0.8);
    ctx.shadowBlur = 18;

    var g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, '#8bd3ff');
    g.addColorStop(1, hexA(level.accent, 0.95));
    ctx.fillStyle = g;
    roundRect(x, y, w, h, 8);
    ctx.fill();
    ctx.restore();

    ctx.strokeStyle = 'rgba(255,255,255,.6)';
    ctx.lineWidth = 1.5;
    roundRect(x, y, w, h, 8);
    ctx.stroke();

    /* 眼睛 */
    var ex = x + w / 2 + P.face * 4;
    ctx.fillStyle = '#06111f';
    ctx.beginPath(); ctx.arc(ex - 5, y + h * 0.36, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex + 4, y + h * 0.36, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(ex - 5.8, y + h * 0.36 - 1, 0.9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex + 3.2, y + h * 0.36 - 1, 0.9, 0, Math.PI * 2); ctx.fill();
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function text(str, x, y, size, color, align, weight) {
    ctx.font = (weight || 700) + ' ' + size + 'px "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    ctx.fillStyle = color;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  }

  function fmt(sec) {
    var m = Math.floor(sec / 60);
    var s = sec - m * 60;
    return (m > 0 ? m + ':' : '') + (s < 10 && m > 0 ? '0' : '') + s.toFixed(2);
  }

  function drawHUD() {
    var got = keysGot.filter(function (v) { return v; }).length;

    /* 顶栏 */
    ctx.fillStyle = 'rgba(6,10,20,.55)';
    ctx.fillRect(0, 0, W, 56);
    ctx.fillStyle = hexA(level.accent, 0.6);
    ctx.fillRect(0, 55, W, 1.5);

    text(level.name, 22, 28, 20, '#e8eefc', 'left', 700);

    /* 钥匙计数（右上） */
    text('🔑 ' + got + '/' + keysGot.length, W - 22, 28, 18, got === keysGot.length ? '#5ef0a8' : '#ffd166', 'right', 700);

    /* 计时 / 死亡 */
    text('⏱ ' + fmt(levelTime), W / 2, 20, 15, 'rgba(200,220,255,.85)', 'center', 600);
    text('☠ ' + deaths + '   ·   R 重开 · M 静音', W / 2, 40, 12, 'rgba(160,190,230,.6)', 'center', 500);
  }

  function drawOverlay() {
    if (state === 'title') {
      ctx.fillStyle = 'rgba(4,8,16,.72)';
      ctx.fillRect(0, 0, W, H);
      var pulse = 0.6 + 0.4 * Math.sin(t * 2.4);
      ctx.save();
      ctx.shadowColor = 'rgba(76,201,240,.9)';
      ctx.shadowBlur = 40;
      text('HK 通关游戏', W / 2, H * 0.34, 62, '#ffffff', 'center', 800);
      ctx.restore();
      text('hktggame · 三关挑战', W / 2, H * 0.34 + 58, 20, 'rgba(180,210,255,.85)', 'center', 500);
      ctx.globalAlpha = pulse;
      text('按 空格 / 点击屏幕 开始', W / 2, H * 0.58, 24, '#4cc9f0', 'center', 700);
      ctx.globalAlpha = 1;
      text('← → / A D 移动　空格 / ↑ / W 跳跃', W / 2, H * 0.72, 16, 'rgba(160,190,230,.75)', 'center', 500);
      text('收集所有钥匙 → 走进发光的门 → 通关', W / 2, H * 0.72 + 28, 16, 'rgba(160,190,230,.55)', 'center', 500);
      if (best > 0) text('最佳纪录 ' + fmt(best), W / 2, H * 0.9, 15, '#ffd166', 'center', 600);
      return;
    }

    if (state === 'clear') {
      var a = 1 - Math.max(0, clearTimer / 0.85);
      ctx.fillStyle = 'rgba(6,20,14,' + (0.55 * a).toFixed(2) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.shadowColor = 'rgba(94,240,168,.9)';
      ctx.shadowBlur = 30;
      text('第 ' + (levelIndex + 1) + ' 关 通关！', W / 2, H * 0.45, 48, '#5ef0a8', 'center', 800);
      ctx.restore();
      ctx.globalAlpha = a;
      text('用时 ' + fmt(levelTime), W / 2, H * 0.55, 20, 'rgba(220,255,240,.9)', 'center', 600);
      ctx.globalAlpha = 1;
      return;
    }

    if (state === 'win') {
      ctx.fillStyle = 'rgba(4,8,16,.82)';
      ctx.fillRect(0, 0, W, H);
      var pu = 0.7 + 0.3 * Math.sin(t * 3);
      ctx.save();
      ctx.shadowColor = 'rgba(255,209,102,.9)';
      ctx.shadowBlur = 44 * pu;
      text('🎉 全部通关！', W / 2, H * 0.32, 58, '#ffd166', 'center', 800);
      ctx.restore();
      text('总用时  ' + fmt(totalTime), W / 2, H * 0.47, 26, '#e8eefc', 'center', 700);
      text('死亡次数  ' + deaths, W / 2, H * 0.47 + 36, 20, 'rgba(200,220,255,.8)', 'center', 500);
      if (best > 0) text('最佳纪录  ' + fmt(best), W / 2, H * 0.47 + 68, 20, '#5ef0a8', 'center', 600);
      var p2 = 0.6 + 0.4 * Math.sin(t * 2.4);
      ctx.globalAlpha = p2;
      text('按 空格 / 点击屏幕 再来一局', W / 2, H * 0.78, 22, '#4cc9f0', 'center', 700);
      ctx.globalAlpha = 1;
      return;
    }

    if (state === 'dead') {
      ctx.fillStyle = 'rgba(60,0,20,.28)';
      ctx.fillRect(0, 0, W, H);
      text('失误！', W / 2, H * 0.46, 40, 'rgba(255,90,130,.95)', 'center', 800);
    }
  }

  /* ---------------- 主循环 ---------------- */
  var last = 0;
  function frame(now) {
    if (!last) last = now;
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;

    update(dt);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);

    /* 屏幕震动 */
    if (shake > 0.2) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    if (level) {
      drawBackground();
      drawSolids();
      drawSpikes();
      drawKeys();
      drawGoal();
      if (state === 'play' || state === 'dead') drawPlayer();
      drawParticles();
      if (state !== 'title') drawHUD();
    } else {
      ctx.fillStyle = '#0b1020';
      ctx.fillRect(0, 0, W, H);
    }

    drawOverlay();

    requestAnimationFrame(frame);
  }

  /* 预热一关用于首页背景 */
  level = LEVELS[0];
  keysGot = level.keys.map(function () { return false; });
  keysGot[0] = true;
  state = 'title';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
